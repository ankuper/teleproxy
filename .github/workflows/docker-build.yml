name: Build and Push Docker Image

on:
  push:
    branches: [ '*' ]  # Build on every branch
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: rkline0x/teleproxy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
      env:
        HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      env:
        HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          ${{ env.HAS_DOCKERHUB == 'true' && env.DOCKERHUB_IMAGE || '' }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build amd64 image for smoke test
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: teleproxy:smoke-test
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}

    - name: Smoke test — HTTP stream POST
      run: |
        SECRET=deadbeef01234567890abcdef0123456
        docker run -d --name smoke-teleproxy \
          -p 127.0.0.1:19129:3129 \
          -e SECRET=$SECRET \
          -e DIRECT_MODE=true \
          -e WORKERS=1 \
          teleproxy:smoke-test \
          -H 3129
        echo "Waiting for container..."
        for i in $(seq 1 15); do
          curl -sf http://127.0.0.1:19129/stats >/dev/null 2>&1 && break
          sleep 1
          [ $i -eq 15 ] && { docker logs smoke-teleproxy; exit 1; }
        done
        echo "Container ready, testing HTTP POST..."
        HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
          -X POST http://127.0.0.1:19129/ \
          -H "Content-Type: application/octet-stream" \
          -H "Transfer-Encoding: chunked" \
          --data-binary "test")
        docker stop smoke-teleproxy && docker rm smoke-teleproxy
        echo "HTTP POST response: $HTTP_CODE"
        if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "400" ]; then
          echo "FAIL: HTTP stream POST rejected ($HTTP_CODE)"
          exit 1
        fi
        echo "PASS: HTTP stream POST accepted"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        provenance: false
        sbom: false
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Clean up attestation artifacts
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete versions tagged only with sha256-* (old attestation/provenance
        # artifacts). Do NOT delete untagged versions — those are the platform
        # manifests (amd64/arm64) referenced by the multi-arch index.
        gh api --paginate \
          /orgs/teleproxy/packages/container/teleproxy/versions \
          --jq '.[] | select(
            (.metadata.container.tags | length > 0) and
            (.metadata.container.tags | all(startswith("sha256-")))
          ) | .id' | while read -r id; do
          echo "Deleting attestation version $id"
          gh api --method DELETE \
            "/orgs/teleproxy/packages/container/teleproxy/versions/$id" || true
        done
